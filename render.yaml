services:
  - type: web
    name: telegram-news-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_news_bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
